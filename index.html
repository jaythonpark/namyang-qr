<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>[남양출고센터] 출입 통합관리</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 0;
      background: #eef2f7;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      line-height: 1.5;
    }
    .wrap { max-width: 580px; margin: 0 auto; padding: 14px 14px 44px; }
    .hero {
      background: linear-gradient(135deg, #0b1f3a 0%, #1e3a8a 100%);
      color: #fff;
      border-radius: 16px;
      padding: 20px 18px;
      margin-bottom: 14px;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.16);
    }
    .hero.mode2 { background: linear-gradient(135deg, #064e3b 0%, #047857 100%); }
    .badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
      letter-spacing: 0.2px;
    }
    .hero h1 { margin: 0 0 6px; font-size: 19.5px; font-weight: 800; line-height: 1.32; }
    .hero p { margin: 0; font-size: 13px; color: rgba(255, 255, 255, 0.9); }
    .card {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }
    .sec-title {
      font-size: 15px;
      font-weight: 800;
      color: #0f172a;
      margin: 0 0 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .notice-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px 13px;
      font-size: 12.5px;
      color: #1e293b;
      line-height: 1.62;
      margin-bottom: 12px;
    }
    .notice-list { margin: 0; padding-left: 18px; }
    .notice-list li { margin-bottom: 5px; }
    .notice-list li:last-child { margin-bottom: 0; }
    .sub-list { margin: 4px 0 6px; padding-left: 18px; list-style-type: lower-roman; color: #334155; }
    .info-banner {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e3a8a;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .warn-banner {
      background: #fefce8;
      border: 1px solid #fde047;
      color: #854d0e;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12.5px;
      font-weight: 700;
      margin-top: 10px;
    }
    .check-row, .field label.check-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #f0f9ff;
      border: 1.5px solid #7dd3fc;
      border-radius: 10px;
      padding: 13px 14px;
      cursor: pointer;
      font-size: 13.5px;
      font-weight: 700;
      color: #0c4a6e;
      margin-bottom: 0;
    }
    .check-row input[type="checkbox"] {
      width: 22px;
      height: 22px;
      margin: 0;
      flex-shrink: 0;
      accent-color: #1d4ed8;
    }
    .purpose-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .purpose-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 46px;
      padding: 10px 8px;
      border: 1.5px solid #94a3b8;
      border-radius: 10px;
      background: #ffffff;
      color: #1e293b;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .purpose-btn.active {
      background: #eff6ff;
      border-color: #1d4ed8;
      color: #1d4ed8;
      box-shadow: 0 0 0 2px rgba(29, 78, 216, 0.18);
    }
    .field { margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }
    .field label {
      display: block;
      font-size: 14px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 6px;
    }
    .req { color: #dc2626; margin-left: 3px; }
    .opt { color: #64748b; font-size: 12px; font-weight: 600; margin-left: 4px; }
    .inp, .ta {
      width: 100%;
      font-size: 16px;
      font-family: inherit;
      color: #0f172a;
      background: #ffffff;
      border: 1.5px solid #94a3b8;
      border-radius: 10px;
      padding: 12px 13px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .inp::placeholder, .ta::placeholder { color: #94a3b8; font-size: 14.5px; }
    .inp:focus, .ta:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
    }
    .ta { min-height: 84px; resize: vertical; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-submit {
      width: 100%;
      height: 54px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
      color: #ffffff;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(29, 78, 216, 0.28);
    }
    .btn-submit.mode2 {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      box-shadow: 0 6px 16px rgba(5, 150, 105, 0.28);
    }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .err-box {
      display: none;
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #991b1b;
      padding: 11px 13px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .done-card {
      display: none;
      background: #ffffff;
      border: 1.5px solid #86efac;
      border-radius: 16px;
      padding: 24px 18px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }
    .done-icon { font-size: 46px; margin-bottom: 8px; }
    .done-title { font-size: 20px; font-weight: 800; color: #065f46; margin: 0 0 6px; }
    .done-sub { font-size: 13.5px; color: #475569; margin: 0 0 16px; }
    .summary-tbl {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13.5px;
      margin-bottom: 18px;
    }
    .summary-tbl th {
      width: 96px;
      padding: 8px 10px;
      background: #f8fafc;
      color: #475569;
      border-bottom: 1px solid #e2e8f0;
      font-weight: 700;
    }
    .summary-tbl td {
      padding: 8px 10px;
      color: #0f172a;
      border-bottom: 1px solid #e2e8f0;
      font-weight: 600;
    }
    .btn-reset {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #0f172a;
      font-size: 14px;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrap" id="app"></div>
  <script>
    const SUBMIT_ENDPOINT = 'https://jaython-macbookair.tailb5b29e.ts.net:8443/submit';
    const mode = new URLSearchParams(location.search).get('mode') === '2' ? '2' : '1';
    let selectedPurpose = '';
    let selectedVisitorType = '';
    let selectedPickupPlace = '';

    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }
    function formatPhone(el) {
      let v = el.value.replace(/[^0-9]/g, '').slice(0, 11);
      if (v.length >= 8) el.value = v.replace(/^(\d{3})(\d{3,4})(\d{4})$/, '$1-$2-$3');
      else if (v.length >= 4) el.value = v.replace(/^(\d{3})(\d+)$/, '$1-$2');
      else el.value = v;
    }
    function showErr(id, msg) {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = '⚠️ ' + msg;
      el.style.display = 'block';
    }
    async function postToServer(payload) {
      const r = await fetch(SUBMIT_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const raw = await r.text();
      let d;
      try { d = JSON.parse(raw); } catch (_) { throw new Error('서버 응답 오류 (' + r.status + ')'); }
      if (!r.ok || !d.ok) throw new Error(d.message || '서버 저장 실패');
      return d;
    }
    function selectPurpose(val) {
      selectedPurpose = val;
      document.querySelectorAll('.purpose-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.val === val);
      });
      const isPickup = (val === '차량인수');
      const isCampaign = (val === '차량점검(캠페인)');
      const pickupCard = document.getElementById('f1-pickup-card');
      const generalCard = document.getElementById('f1-general-card');
      const campBox = document.getElementById('f1-campaign-box');
      const noticeEl = document.getElementById('f1-purpose-notice');
      if (pickupCard) pickupCard.style.display = isPickup ? 'block' : 'none';
      if (generalCard) generalCard.style.display = isPickup ? 'none' : 'block';
      if (campBox) campBox.style.display = isCampaign ? 'block' : 'none';
      if (noticeEl) {
        noticeEl.style.display = 'block';
        noticeEl.textContent = isCampaign
          ? '📌 차량점검(캠페인) 대상자는 작업 완료 후 반드시 2차 완료 QR을 추가 작성해 주세요.'
          : `✅ '${val}' 방문자는 1차 출입등록만 작성하시면 완료됩니다. (2차 양식 작성 불필요)`;
      }
    }
    function selectSingleOption(group, val) {
      if (group === 'visitor') selectedVisitorType = val;
      if (group === 'pickup') selectedPickupPlace = val;
      document.querySelectorAll(`.opt-btn[data-group="${group}"]`).forEach(btn => {
        btn.classList.toggle('active', btn.dataset.val === val);
      });
    }

    if (mode === '1') {
      document.title = '[남양출고센터] 출입 통합관리 등록 및 서약서 (1차)';
      document.getElementById('app').innerHTML = `
        <div class="hero">
          <span class="badge">1차 출입 통합관리 · QR</span>
          <h1>[남양출고센터] 출입 등록 및 보안·안전 서약서</h1>
          <p>방문 전 아래 준수사항·동의서 확인 및 출입 정보를 입력해 주세요.</p>
        </div>
        <div id="form-box">
          <div class="card">
            <h2 class="sec-title">1. 보안 유지 준수 사항</h2>
            <div class="notice-box">
              <ol class="notice-list" type="a">
                <li>허가된 구역 외의 장소에는 출입하지 않으며, 안내자 없이 이동하지 않습니다.</li>
                <li>사업장 내 업무 자료, 설비, 제품, 기술정보 등을 무단으로 촬영, 복사, 반출하지 않습니다.</li>
                <li>취득한 회사의 영업비밀 및 기밀정보를 제3자에게 누설하거나 목적 외로 사용하지 않습니다.</li>
                <li>회사 시설물(전산장비, 문서, 자산 등)을 임의로 조작하거나 훼손하지 않습니다.</li>
              </ol>
            </div>
            <label class="check-row"><input type="checkbox" id="f1-security" /><span>[필수] 위 보안 유지 준수 사항을 확인하였으며 준수할 것에 동의합니다.</span></label>
          </div>

          <div class="card">
            <h2 class="sec-title">2. 안전 수칙 준수 사항</h2>
            <div class="notice-box">
              <ol class="notice-list" type="a">
                <li>출입 시 회사가 지정한 안전교육 및 안내 사항을 이수합니다.</li>
                <li>지정된 보호구(안전모, 안전화, 보안경 등)를 착용하고, 흡연 및 음주는 지정 장소 외에서 하지 않습니다.</li>
                <li>지정 통로와 대피 경로를 준수하며, 위험구역 및 출입통제구역에 임의로 들어가지 않습니다.</li>
                <li>작업 중인 설비나 장비를 임의로 조작하지 않으며, 사고 또는 위험 상황 발견 시 즉시 담당자에게 알립니다.</li>
                <li>사고 발생 시 회사의 안전 관리 지침에 따르며, 본인 과실로 인한 사고에 대해서는 관계 법령에 따라 책임을 집니다.</li>
              </ol>
            </div>
            <label class="check-row"><input type="checkbox" id="f1-safety" /><span>[필수] 위 안전 수칙 준수 사항을 확인하였으며 준수할 것에 동의합니다.</span></label>
          </div>

          <div class="card">
            <h2 class="sec-title">3. 개인정보 수집 및 이용 동의(필수)</h2>
            <div class="notice-box">
              <ol class="notice-list" type="a">
                <li>회사는 출입 관리 및 보안, 안전사고 대응을 위하여 아래와 같이 개인정보를 수집/이용 합니다. (개인정보보호법 제 15조 1항 1호("정보주체의 동의"))
                  <ul class="sub-list">
                    <li><b>수집항목</b> : 성명, 소속, 연락처, 출입일시, 차량번호(센터내 출입시)</li>
                    <li><b>수집/이용 목적</b> : 출입 허가 및 신원 확인, 보안 관리, 비상 연락, 안전사고 발생 시 대응, 차량의 출입허가 및 차량 신원 확인</li>
                    <li><b>보유/이용 기간</b> : 출입 종료 후 1년간 보관 후 파기</li>
                  </ul>
                </li>
                <li>위 개인정보의 수집/이용에 동의하지 않을 권리가 있습니다.</li>
                <li>다만, 동의를 거부하실 경우 사업장 출입이 제한 될 수 있습니다.</li>
              </ol>
            </div>
            <label class="check-row"><input type="checkbox" id="f1-privacy" /><span>[필수] 위 개인정보 수집 및 이용에 동의합니다.</span></label>
          </div>

          <div class="card">
            <h2 class="sec-title">🧭 방문목적 선택<span class="req">*</span></h2>
            <div class="purpose-grid">
              <button type="button" class="purpose-btn" data-val="차량인수" onclick="selectPurpose('차량인수')">🚗 차량인수</button>
              <button type="button" class="purpose-btn" data-val="회의" onclick="selectPurpose('회의')">💬 회의</button>
              <button type="button" class="purpose-btn" data-val="차량점검(캠페인)" onclick="selectPurpose('차량점검(캠페인)')">🔧 차량점검(캠페인)</button>
              <button type="button" class="purpose-btn" data-val="기타" onclick="selectPurpose('기타')">📌 기타</button>
            </div>
            <div id="f1-purpose-notice" class="warn-banner" style="display:none;"></div>
          </div>

          <div id="f1-pickup-card" class="card" style="display:none;">
            <h2 class="sec-title">🚗 차량인수 출입자 정보 입력</h2>
            <div class="field">
              <label>1. 방문자 구분<span class="req">*</span></label>
              <div class="purpose-grid">
                <button type="button" class="purpose-btn opt-btn" data-group="visitor" data-val="차량계약자" onclick="selectSingleOption('visitor','차량계약자')">차량계약자</button>
                <button type="button" class="purpose-btn opt-btn" data-group="visitor" data-val="차량인수 지정자(카마스터, 대리인)" onclick="selectSingleOption('visitor','차량인수 지정자(카마스터, 대리인)')">차량인수 지정자<br/>(카마스터, 대리인)</button>
              </div>
            </div>
            <div class="field">
              <label>2. 인수처 구분<span class="req">*</span></label>
              <div class="purpose-grid">
                <button type="button" class="purpose-btn opt-btn" data-group="pickup" data-val="배달탁송사" onclick="selectSingleOption('pickup','배달탁송사')">배달탁송사</button>
                <button type="button" class="purpose-btn opt-btn" data-group="pickup" data-val="현대자동차(방문출고 예약자 한정)" onclick="selectSingleOption('pickup','현대자동차(방문출고 예약자 한정)')">현대자동차<br/>(방문출고 예약자 한정)</button>
              </div>
            </div>
            <div class="field"><label for="fp-car">3. 인수받으실 차종(싼타페, 투싼 등)<span class="req">*</span></label><input id="fp-car" class="inp" type="text" placeholder="예: 싼타페, 투싼, GV70 등" /></div>
            <div class="field"><label for="fp-name">4. 방문자 성함<span class="req">*</span></label><input id="fp-name" class="inp" type="text" placeholder="예: 홍길동" /></div>
            <div class="field"><label for="fp-phone">5. 방문자 연락처<span class="req">*</span></label><input id="fp-phone" class="inp" type="tel" inputmode="numeric" oninput="formatPhone(this)" placeholder="숫자만 입력 (예: 010-0000-0000)" /></div>
            <div class="field">
              <label class="check-row"><input type="checkbox" id="fp-smoking" /><span>6. 흡연은 지정된 흡연장소에서만 가능합니다.<span class="req">*</span></span></label>
            </div>
            <div class="field">
              <label class="check-row"><input type="checkbox" id="fp-doc" /><span>7. 차량 인수 후 나가실때 안내받으신 '서류'를 정문 제출해야 합니다.<span class="req">*</span></span></label>
            </div>
          </div>

          <div id="f1-general-card" class="card">
            <h2 class="sec-title">✍️ 출입자 정보 입력</h2>
            <div class="field"><label for="f1-company">1) 업체명(소속)<span class="req">*</span></label><input id="f1-company" class="inp" type="text" placeholder="예: 현대자동차 울산공장 품관2부" /></div>
            <div class="field"><label for="f1-name">2) 성명/직급<span class="req">*</span></label><input id="f1-name" class="inp" type="text" placeholder="예: 홍길동(매니저)" /></div>
            <div class="field"><label for="f1-headcount">3) 인원수<span class="req">*</span></label><input id="f1-headcount" class="inp" type="text" placeholder="예: 3명(본인포함)" /></div>
            <div class="field"><label for="f1-phone">4) 연락처<span class="req">*</span></label><input id="f1-phone" class="inp" type="tel" inputmode="numeric" oninput="formatPhone(this)" placeholder="예: 010-1234-1234" /></div>
            <div class="field"><label for="f1-carno">5) 차량번호<span class="opt">(센터내 차량 출입시)</span></label><input id="f1-carno" class="inp" type="text" placeholder="예: 12가3456 (미출입 시 공란)" /></div>
            <div id="f1-campaign-box" style="display:none;margin-top:14px;padding-top:14px;border-top:1px dashed #cbd5e1;">
              <div class="field"><label for="f1-car">6) 점검차종<span class="req">*</span></label><input id="f1-car" class="inp" type="text" placeholder="예: GV60, GV70" /></div>
              <div class="field"><label for="f1-content">7) 점검내용<span class="req">*</span></label><textarea id="f1-content" class="ta" placeholder="예: 내/외관 점검"></textarea></div>
            </div>
          </div>

          <div id="f1-err" class="err-box"></div>
          <button type="button" id="f1-btn" class="btn-submit" onclick="submit1()">✅ 1차 출입 등록 제출</button>
        </div>
        <div id="done-box" class="done-card">
          <div class="done-icon">✅</div>
          <h2 class="done-title">출입 등록이 완료되었습니다</h2>
          <p class="done-sub" id="done-ts"></p>
          <table class="summary-tbl" id="done-tbl"></table>
          <button type="button" class="btn-reset" onclick="location.reload()">새로 작성하기</button>
        </div>`;
    } else {
      document.title = '[남양출고센터] 차량점검(캠페인) 완료 통보 (2차)';
      document.getElementById('app').innerHTML = `
        <div class="hero mode2">
          <span class="badge">2차 완료 통보 · 차량점검(캠페인) 전용</span>
          <h1>[남양출고센터] 차량점검(캠페인) 완료 통보 (2차)</h1>
          <p>차량점검(캠페인) 대상자만 작업 완료 후 작성해 주세요. 완료시간은 제출 시각으로 자동 기록됩니다.</p>
        </div>
        <div id="form-box">
          <div class="info-banner">💡 <b>차량점검(캠페인) 대상자 전용</b>입니다. 1차 출입등록 시 입력한 <b>업체명 · 성명/직급 · 연락처</b>와 동일하게 입력하시면 자동 매칭됩니다.</div>
          <div class="card">
            <h2 class="sec-title">👤 작업자 확인 정보</h2>
            <div class="field"><label for="f2-company">1) 업체명(소속)<span class="req">*</span></label><input id="f2-company" class="inp" type="text" placeholder="예: 현대자동차 울산공장 품관2부" /></div>
            <div class="field"><label for="f2-name">2) 성명/직급<span class="req">*</span></label><input id="f2-name" class="inp" type="text" placeholder="예: 홍길동(매니저)" /></div>
            <div class="field"><label for="f2-phone">3) 연락처<span class="req">*</span></label><input id="f2-phone" class="inp" type="tel" inputmode="numeric" oninput="formatPhone(this)" placeholder="예: 010-1234-1234" /></div>
          </div>
          <div class="card">
            <h2 class="sec-title">📊 점검 결과 입력</h2>
            <div class="grid-2" style="margin-bottom:14px;">
              <div class="field" style="margin-bottom:0;"><label for="f2-inspected">점검대수<span class="req">*</span></label><input id="f2-inspected" class="inp" type="number" inputmode="numeric" min="0" placeholder="예: 12" /></div>
              <div class="field" style="margin-bottom:0;"><label for="f2-fixed">조치대수<span class="req">*</span></label><input id="f2-fixed" class="inp" type="number" inputmode="numeric" min="0" placeholder="예: 2" /></div>
            </div>
            <div class="field"><label for="f2-note">특이사항</label><textarea id="f2-note" class="ta" placeholder="예: 특이사항 없음 (특이사항 발생 시 상세 내용 입력)"></textarea></div>
          </div>
          <div id="f2-err" class="err-box"></div>
          <button type="button" id="f2-btn" class="btn-submit mode2" onclick="submit2()">🏁 2차 완료 통보 제출</button>
        </div>
        <div id="done-box" class="done-card">
          <div class="done-icon">🏁</div>
          <h2 class="done-title">차량점검(캠페인) 완료 통보가 접수되었습니다</h2>
          <p class="done-sub" id="done-ts"></p>
          <table class="summary-tbl" id="done-tbl"></table>
          <button type="button" class="btn-reset" onclick="location.reload()">새로 작성하기</button>
        </div>`;
    }

    async function submit1() {
      document.getElementById('f1-err').style.display = 'none';
      const agreeSecurity = document.getElementById('f1-security').checked;
      const agreeSafety = document.getElementById('f1-safety').checked;
      const agreePrivacy = document.getElementById('f1-privacy').checked;
      if (!agreeSecurity || !agreeSafety || !agreePrivacy) return showErr('f1-err', '보안 유지, 안전 수칙, 개인정보 수집·이용 필수 동의 3건을 모두 체크해 주세요.');
      if (!selectedPurpose) return showErr('f1-err', '방문목적을 선택해 주세요.');

      let p;
      if (selectedPurpose === '차량인수') {
        p = {
          mode: '1',
          purpose: '차량인수',
          agreeSecurity, agreeSafety, agreePrivacy,
          visitorType: selectedVisitorType,
          pickupPlace: selectedPickupPlace,
          carModel: document.getElementById('fp-car').value.trim(),
          name: document.getElementById('fp-name').value.trim(),
          phone: document.getElementById('fp-phone').value.trim(),
          agreeSmoking: document.getElementById('fp-smoking').checked,
          agreeDocSubmit: document.getElementById('fp-doc').checked,
        };
        if (!p.visitorType) return showErr('f1-err', '1. 방문자 구분을 선택해 주세요.');
        if (!p.pickupPlace) return showErr('f1-err', '2. 인수처 구분을 선택해 주세요.');
        if (!p.carModel || !p.name || !p.phone) return showErr('f1-err', '3~5번 항목(차종, 방문자 성함, 방문자 연락처)을 모두 입력해 주세요.');
        if (!p.agreeSmoking || !p.agreeDocSubmit) return showErr('f1-err', '6~7번 필수 안내 사항 체크박스를 모두 체크해 주세요.');
      } else {
        p = {
          mode: '1',
          purpose: selectedPurpose,
          agreeSecurity, agreeSafety, agreePrivacy,
          company: document.getElementById('f1-company').value.trim(),
          name: document.getElementById('f1-name').value.trim(),
          headcount: document.getElementById('f1-headcount').value.trim(),
          phone: document.getElementById('f1-phone').value.trim(),
          carNo: document.getElementById('f1-carno').value.trim(),
          carModel: document.getElementById('f1-car').value.trim(),
          content: document.getElementById('f1-content').value.trim(),
        };
        if (!p.company || !p.name || !p.headcount || !p.phone) return showErr('f1-err', '업체명(소속), 성명/직급, 인원수, 연락처를 모두 입력해 주세요.');
        if (p.purpose === '차량점검(캠페인)' && (!p.carModel || !p.content)) return showErr('f1-err', '차량점검(캠페인) 대상자는 점검차종과 점검내용을 입력해 주세요.');
      }

      const btn = document.getElementById('f1-btn');
      btn.disabled = true; btn.textContent = '⏳ 등록 중...';
      try {
        const res = await postToServer(p);
        document.getElementById('form-box').style.display = 'none';
        document.getElementById('done-box').style.display = 'block';
        document.getElementById('done-ts').textContent = res.requiresSecondForm
          ? `등록 시각: ${res.timestamp} · 작업 완료 후 2차 완료 QR을 스캔해 주세요.`
          : `등록 시각: ${res.timestamp} · 출입 등록이 완료되었습니다. (2차 양식 작성 불필요)`;
        const s = res.summary || {};
        if (selectedPurpose === '차량인수') {
          document.getElementById('done-tbl').innerHTML =
            `<tr><th>방문목적</th><td>${esc(s.purpose)}</td></tr>` +
            `<tr><th>방문자 구분</th><td>${esc(s.visitorType)}</td></tr>` +
            `<tr><th>인수처 구분</th><td>${esc(s.pickupPlace)}</td></tr>` +
            `<tr><th>인수 차종</th><td>${esc(s.carModel)}</td></tr>` +
            `<tr><th>방문자 성함</th><td>${esc(s.name)}</td></tr>` +
            `<tr><th>연락처</th><td>${esc(s.phone)}</td></tr>`;
        } else {
          document.getElementById('done-tbl').innerHTML =
            `<tr><th>방문목적</th><td>${esc(s.purpose)}</td></tr>` +
            `<tr><th>업체명</th><td>${esc(s.company)}</td></tr>` +
            `<tr><th>성명/직급</th><td>${esc(s.name)}</td></tr>` +
            `<tr><th>인원수</th><td>${esc(s.headcount)}</td></tr>` +
            `<tr><th>연락처</th><td>${esc(s.phone)}</td></tr>` +
            `<tr><th>차량번호</th><td>${esc(s.carNo || '-')}</td></tr>` +
            (res.requiresSecondForm ? `<tr><th>점검차종</th><td>${esc(s.carModel)}</td></tr><tr><th>점검내용</th><td>${esc(s.content)}</td></tr>` : '');
        }
      } catch (e) {
        btn.disabled = false; btn.textContent = '✅ 1차 출입 등록 제출';
        showErr('f1-err', '전송 오류: ' + e.message);
      }
    }

    async function submit2() {
      document.getElementById('f2-err').style.display = 'none';
      const p = {
        mode: '2',
        company: document.getElementById('f2-company').value.trim(),
        name: document.getElementById('f2-name').value.trim(),
        phone: document.getElementById('f2-phone').value.trim(),
        inspectedCount: document.getElementById('f2-inspected').value.trim(),
        fixedCount: document.getElementById('f2-fixed').value.trim(),
        note: document.getElementById('f2-note').value.trim() || '특이사항 없음',
      };
      if (!p.company || !p.name || !p.phone || p.inspectedCount === '' || p.fixedCount === '') return showErr('f2-err', '필수 항목을 모두 입력해 주세요.');
      const btn = document.getElementById('f2-btn');
      btn.disabled = true; btn.textContent = '⏳ 전송 중...';
      try {
        const res = await postToServer(p);
        document.getElementById('form-box').style.display = 'none';
        document.getElementById('done-box').style.display = 'block';
        document.getElementById('done-ts').textContent = `완료 시각: ${res.timestamp} · 매칭상태: ${res.matchStatus}`;
        document.getElementById('done-tbl').innerHTML =
          `<tr><th>업체명</th><td>${esc(p.company)}</td></tr>` +
          `<tr><th>성명/직급</th><td>${esc(p.name)}</td></tr>` +
          `<tr><th>연락처</th><td>${esc(p.phone)}</td></tr>` +
          `<tr><th>점검대수</th><td>${esc(p.inspectedCount)}대</td></tr>` +
          `<tr><th>조치대수</th><td>${esc(p.fixedCount)}대</td></tr>` +
          `<tr><th>특이사항</th><td>${esc(p.note)}</td></tr>`;
      } catch (e) {
        btn.disabled = false; btn.textContent = '🏁 2차 완료 통보 제출';
        showErr('f2-err', '전송 오류: ' + e.message);
      }
    }
  </script>
</body>
</html>
