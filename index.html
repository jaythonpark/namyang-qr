<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>[남양출고센터] 협력사 사전점검 출입관리</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 0;
      background: #eef2f7;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      line-height: 1.5;
    }
    .wrap { max-width: 560px; margin: 0 auto; padding: 14px 14px 40px; }
    .hero {
      background: linear-gradient(135deg, #0b1f3a 0%, #1e3a8a 100%);
      color: #fff;
      border-radius: 16px;
      padding: 20px 18px;
      margin-bottom: 14px;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.16);
    }
    .hero.mode2 { background: linear-gradient(135deg, #064e3b 0%, #047857 100%); }
    .badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
      letter-spacing: 0.2px;
    }
    .hero h1 { margin: 0 0 6px; font-size: 20px; font-weight: 800; line-height: 1.32; }
    .hero p { margin: 0; font-size: 13px; color: rgba(255, 255, 255, 0.88); }
    .card {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }
    .sec-title {
      font-size: 15px;
      font-weight: 800;
      color: #0f172a;
      margin: 0 0 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .notice-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px;
      font-size: 12.5px;
      color: #334155;
      line-height: 1.6;
      margin-bottom: 12px;
    }
    .notice-box ul { margin: 6px 0 0; padding-left: 18px; }
    .notice-box li { margin-bottom: 4px; }
    .info-banner {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e3a8a;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .check-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: #f0f9ff;
      border: 1.5px solid #7dd3fc;
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
      font-size: 13.5px;
      font-weight: 700;
      color: #0c4a6e;
    }
    .check-row input[type="checkbox"] {
      width: 22px;
      height: 22px;
      margin: 0;
      flex-shrink: 0;
      accent-color: #1d4ed8;
    }
    .field { margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }
    .field label {
      display: block;
      font-size: 14px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 6px;
    }
    .req { color: #dc2626; margin-left: 3px; }
    .inp, .ta {
      width: 100%;
      font-size: 16px;
      font-family: inherit;
      color: #0f172a;
      background: #ffffff;
      border: 1.5px solid #94a3b8;
      border-radius: 10px;
      padding: 12px 13px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .inp::placeholder, .ta::placeholder { color: #94a3b8; font-size: 15px; }
    .inp:focus, .ta:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
    }
    .ta { min-height: 88px; resize: vertical; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-submit {
      width: 100%;
      height: 54px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
      color: #ffffff;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(29, 78, 216, 0.28);
    }
    .btn-submit.mode2 {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      box-shadow: 0 6px 16px rgba(5, 150, 105, 0.28);
    }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .err-box {
      display: none;
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #991b1b;
      padding: 11px 13px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .done-card {
      display: none;
      background: #ffffff;
      border: 1.5px solid #86efac;
      border-radius: 16px;
      padding: 24px 18px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }
    .done-icon { font-size: 46px; margin-bottom: 8px; }
    .done-title { font-size: 20px; font-weight: 800; color: #065f46; margin: 0 0 6px; }
    .done-sub { font-size: 13.5px; color: #475569; margin: 0 0 16px; }
    .summary-tbl {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13.5px;
      margin-bottom: 18px;
    }
    .summary-tbl th {
      width: 96px;
      padding: 8px 10px;
      background: #f8fafc;
      color: #475569;
      border-bottom: 1px solid #e2e8f0;
      font-weight: 700;
    }
    .summary-tbl td {
      padding: 8px 10px;
      color: #0f172a;
      border-bottom: 1px solid #e2e8f0;
      font-weight: 600;
    }
    .btn-reset {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #0f172a;
      font-size: 14px;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrap" id="app"></div>
  <script>
    const SUBMIT_ENDPOINT = 'https://jaython-macbookair.tailb5b29e.ts.net:8443/submit';
    const mode = new URLSearchParams(location.search).get('mode') === '2' ? '2' : '1';

    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }
    function formatPhone(el) {
      let v = el.value.replace(/[^0-9]/g, '').slice(0, 11);
      if (v.length >= 8) el.value = v.replace(/^(\d{3})(\d{3,4})(\d{4})$/, '$1-$2-$3');
      else if (v.length >= 4) el.value = v.replace(/^(\d{3})(\d+)$/, '$1-$2');
      else el.value = v;
    }
    function showErr(id, msg) {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = '⚠️ ' + msg;
      el.style.display = 'block';
    }

    async function postToServer(payload) {
      const r = await fetch(SUBMIT_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const d = await r.json();
      if (!r.ok || !d.ok) throw new Error(d.message || '서버 저장 실패');
      return d;
    }

    if (mode === '1') {
      document.title = '[남양출고센터] 내수 완성차 사전점검 출입등록 및 서약서 (1차)';
      document.getElementById('app').innerHTML = `
        <div class="hero">
          <span class="badge">1차 입실 등록 · QR</span>
          <h1>[남양출고센터] 내수 완성차 사전점검 출입등록 및 서약서</h1>
          <p>방문 전 아래 동의사항 확인 및 출입 정보를 입력해 주세요. (예시 문구 참고)</p>
        </div>
        <div id="form-box">
          <div class="card">
            <h2 class="sec-title">🔒 개인정보 수집·이용 및 임시 처리 안내</h2>
            <div class="notice-box">
              회사는 사업장 시설 보안, 출입 통제 및 산업안전사고 예방을 위해 아래와 같이 개인정보를 수집·이용합니다.
              <ul>
                <li><b>수집 목적</b>: 출입 자격 확인, 사전점검 작업 관리 및 비상 연락</li>
                <li><b>수집 항목</b>: 업체명(소속), 성명/직급, 인원수, 연락처</li>
                <li><b>임시 저장 데이터 즉시 파기</b>: 본 접수는 모바일 접수 창구로만 활용되며, 매일 18시 사내 그룹메일 이관 발송 직후 구글 클라우드에서 즉시 자동 삭제됩니다.</li>
                <li><b>동의 거부 권리</b>: 동의를 거부할 수 있으나, 미동의 시 출입 및 사전점검 작업이 제한됩니다.</li>
              </ul>
            </div>
            <label class="check-row"><input type="checkbox" id="f1-privacy" /><span>[필수] 위 개인정보 수집·이용 및 임시 처리 안내에 동의합니다.</span></label>
          </div>
          <div class="card">
            <h2 class="sec-title">📋 서약 및 안전 준수사항</h2>
            <div class="notice-box">
              사전점검 실시 및 완료 후 위반사항 발견 시 출고센터에서 CLAIM을 제기하여도 일체 수용할 것을 서약합니다.
              <ul>
                <li>도어 OPEN 시 옆차 간격 주의 / 복장 돌출물 손상 주의</li>
                <li>실내 부품 손상·오염 주의 / 도어 닫힘·시동방치·유리·선루프 오픈 주의</li>
                <li>회사 재산 피해 및 임의 이동·반출 금지 / 작업 구역 외 무단 출입 금지</li>
                <li>출입증 패용 필수 / 점검 완료 후 <b>2차 완료 QR</b> 반드시 스캔 제출</li>
              </ul>
            </div>
            <label class="check-row"><input type="checkbox" id="f1-pledge" /><span>[필수] 위 서약 및 안전 준수사항을 숙지하였으며 준수할 것을 서약합니다.</span></label>
          </div>
          <div class="card">
            <h2 class="sec-title">✍️ 출입 및 사전점검 정보 입력</h2>
            <div class="field"><label for="f1-company">1) 업체명<span class="req">*</span></label><input id="f1-company" class="inp" type="text" placeholder="예: 현대자동차 울산공장 품관2부" /></div>
            <div class="field"><label for="f1-name">2) 성명/직급<span class="req">*</span></label><input id="f1-name" class="inp" type="text" placeholder="예: 홍길동(매니저)" /></div>
            <div class="field"><label for="f1-headcount">3) 인원수<span class="req">*</span></label><input id="f1-headcount" class="inp" type="text" placeholder="예: 3명(본인포함)" /></div>
            <div class="field"><label for="f1-phone">4) 연락처<span class="req">*</span></label><input id="f1-phone" class="inp" type="tel" inputmode="numeric" oninput="formatPhone(this)" placeholder="예: 010-1234-1234" /></div>
            <div class="field"><label for="f1-car">5) 점검차종<span class="req">*</span></label><input id="f1-car" class="inp" type="text" placeholder="예: GV60, GV70" /></div>
            <div class="field"><label for="f1-content">6) 점검내용<span class="req">*</span></label><textarea id="f1-content" class="ta" placeholder="예: 내/외관 점검"></textarea></div>
          </div>
          <div id="f1-err" class="err-box"></div>
          <button type="button" id="f1-btn" class="btn-submit" onclick="submit1()">✅ 1차 입실 등록 제출</button>
        </div>
        <div id="done-box" class="done-card">
          <div class="done-icon">✅</div>
          <h2 class="done-title">1차 입실 등록이 완료되었습니다</h2>
          <p class="done-sub" id="done-ts"></p>
          <table class="summary-tbl" id="done-tbl"></table>
          <button type="button" class="btn-reset" onclick="location.reload()">새로 작성하기</button>
        </div>`;
    } else {
      document.title = '[남양출고센터] 사전점검 완료 통보 (2차)';
      document.getElementById('app').innerHTML = `
        <div class="hero mode2">
          <span class="badge">2차 완료 통보 · QR</span>
          <h1>[남양출고센터] 사전점검 완료 통보 (2차)</h1>
          <p>현장 사전점검 완료 후 결과를 입력해 주세요. 완료시간은 제출 시각으로 자동 기록됩니다.</p>
        </div>
        <div id="form-box">
          <div class="info-banner">💡 1차 출입등록 시 입력한 <b>업체명 · 성명/직급 · 연락처</b>와 동일하게 입력하시면 자동으로 매칭됩니다.</div>
          <div class="card">
            <h2 class="sec-title">👤 작업자 확인 정보</h2>
            <div class="field"><label for="f2-company">1) 업체명<span class="req">*</span></label><input id="f2-company" class="inp" type="text" placeholder="예: 현대자동차 울산공장 품관2부" /></div>
            <div class="field"><label for="f2-name">2) 성명/직급<span class="req">*</span></label><input id="f2-name" class="inp" type="text" placeholder="예: 홍길동(매니저)" /></div>
            <div class="field"><label for="f2-phone">3) 연락처<span class="req">*</span></label><input id="f2-phone" class="inp" type="tel" inputmode="numeric" oninput="formatPhone(this)" placeholder="예: 010-1234-1234" /></div>
          </div>
          <div class="card">
            <h2 class="sec-title">📊 점검 결과 입력</h2>
            <div class="grid-2" style="margin-bottom:14px;">
              <div class="field" style="margin-bottom:0;"><label for="f2-inspected">점검대수<span class="req">*</span></label><input id="f2-inspected" class="inp" type="number" inputmode="numeric" min="0" placeholder="예: 12" /></div>
              <div class="field" style="margin-bottom:0;"><label for="f2-fixed">조치대수<span class="req">*</span></label><input id="f2-fixed" class="inp" type="number" inputmode="numeric" min="0" placeholder="예: 2" /></div>
            </div>
            <div class="field"><label for="f2-note">특이사항</label><textarea id="f2-note" class="ta" placeholder="예: 특이사항 없음 (특이사항 발생 시 상세 내용 입력)"></textarea></div>
          </div>
          <div id="f2-err" class="err-box"></div>
          <button type="button" id="f2-btn" class="btn-submit mode2" onclick="submit2()">🏁 2차 완료 통보 제출</button>
        </div>
        <div id="done-box" class="done-card">
          <div class="done-icon">🏁</div>
          <h2 class="done-title">사전점검 완료 통보가 접수되었습니다</h2>
          <p class="done-sub" id="done-ts"></p>
          <table class="summary-tbl" id="done-tbl"></table>
          <button type="button" class="btn-reset" onclick="location.reload()">새로 작성하기</button>
        </div>`;
    }

    async function submit1() {
      document.getElementById('f1-err').style.display = 'none';
      const p = {
        mode: '1',
        agreePrivacy: document.getElementById('f1-privacy').checked,
        agreePledge: document.getElementById('f1-pledge').checked,
        company: document.getElementById('f1-company').value.trim(),
        name: document.getElementById('f1-name').value.trim(),
        headcount: document.getElementById('f1-headcount').value.trim(),
        phone: document.getElementById('f1-phone').value.trim(),
        carModel: document.getElementById('f1-car').value.trim(),
        content: document.getElementById('f1-content').value.trim(),
      };
      if (!p.agreePrivacy || !p.agreePledge) return showErr('f1-err', '개인정보 동의 및 서약서 필수 체크를 완료해 주세요.');
      if (!p.company || !p.name || !p.headcount || !p.phone || !p.carModel || !p.content) return showErr('f1-err', '모든 필수 입력 항목을 작성해 주세요.');
      const btn = document.getElementById('f1-btn');
      btn.disabled = true; btn.textContent = '⏳ 등록 중...';
      try {
        const res = await postToServer(p);
        document.getElementById('form-box').style.display = 'none';
        document.getElementById('done-box').style.display = 'block';
        document.getElementById('done-ts').textContent = '등록 시각: ' + res.timestamp + ' · 작업 완료 후 2차 QR을 스캔해 주세요.';
        document.getElementById('done-tbl').innerHTML =
          `<tr><th>업체명</th><td>${esc(p.company)}</td></tr>` +
          `<tr><th>성명/직급</th><td>${esc(p.name)}</td></tr>` +
          `<tr><th>인원수</th><td>${esc(p.headcount)}</td></tr>` +
          `<tr><th>연락처</th><td>${esc(p.phone)}</td></tr>` +
          `<tr><th>점검차종</th><td>${esc(p.carModel)}</td></tr>` +
          `<tr><th>점검내용</th><td>${esc(p.content)}</td></tr>`;
      } catch (e) {
        btn.disabled = false; btn.textContent = '✅ 1차 입실 등록 제출';
        showErr('f1-err', '전송 오류: ' + e.message);
      }
    }

    async function submit2() {
      document.getElementById('f2-err').style.display = 'none';
      const p = {
        mode: '2',
        company: document.getElementById('f2-company').value.trim(),
        name: document.getElementById('f2-name').value.trim(),
        phone: document.getElementById('f2-phone').value.trim(),
        inspectedCount: document.getElementById('f2-inspected').value.trim(),
        fixedCount: document.getElementById('f2-fixed').value.trim(),
        note: document.getElementById('f2-note').value.trim() || '특이사항 없음',
      };
      if (!p.company || !p.name || !p.phone || p.inspectedCount === '' || p.fixedCount === '') return showErr('f2-err', '필수 항목을 모두 입력해 주세요.');
      const btn = document.getElementById('f2-btn');
      btn.disabled = true; btn.textContent = '⏳ 전송 중...';
      try {
        const res = await postToServer(p);
        document.getElementById('form-box').style.display = 'none';
        document.getElementById('done-box').style.display = 'block';
        document.getElementById('done-ts').textContent = '완료 시각: ' + res.timestamp + ' · 매칭상태: ' + res.matchStatus;
        document.getElementById('done-tbl').innerHTML =
          `<tr><th>업체명</th><td>${esc(p.company)}</td></tr>` +
          `<tr><th>성명/직급</th><td>${esc(p.name)}</td></tr>` +
          `<tr><th>연락처</th><td>${esc(p.phone)}</td></tr>` +
          `<tr><th>점검대수</th><td>${esc(p.inspectedCount)}대</td></tr>` +
          `<tr><th>조치대수</th><td>${esc(p.fixedCount)}대</td></tr>` +
          `<tr><th>특이사항</th><td>${esc(p.note)}</td></tr>`;
      } catch (e) {
        btn.disabled = false; btn.textContent = '🏁 2차 완료 통보 제출';
        showErr('f2-err', '전송 오류: ' + e.message);
      }
    }
  </script>
</body>
</html>
